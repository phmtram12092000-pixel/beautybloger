<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>404 - Page Not Found | GlowEssence Cosmetics</title>
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" type="image/png" href="./images/category-1.png">
    <style>
        .notfound-wrapper {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 2rem;
            margin-top: 8rem;
        }
        .notfound-card {
            max-width: 600px;
            background: #fff;
            padding: 5rem 3rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
        }
        .notfound-code {
            font-size: 9rem;
            font-weight: 800;
            line-height: 1;
            color: #e84393;
            letter-spacing: -2px;
            margin-bottom: 1.5rem;
        }
        .notfound-title {
            font-size: 2.6rem;
            color: #222;
            margin-bottom: 1.2rem;
        }
        .notfound-desc {
            font-size: 1.5rem;
            color: #666;
            margin-bottom: 3rem;
            line-height: 1.6;
            text-transform: none;
        }
        .notfound-btn {
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            padding: 1.2rem 3.5rem;
            font-size: 1.6rem;
            font-weight: 600;
            background: #e84393;
            color: #fff;
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(232, 67, 147, 0.35);
            transition: all 0.25s ease;
        }
        .notfound-btn:hover {
            background: #d63031;
            transform: translateY(-2px);
            color: #fff;
        }
    </style>
</head>
<body>

<header class="header">
    <a href="index.html#home" class="logo"> <img src="images/logo.png" alt="GlowEssence Cosmetics Logo"> </a>
</header>

<main class="notfound-wrapper">
    <div class="notfound-card">
        <div class="notfound-code">404</div>
        <h1 class="notfound-title">Looks Like This Page Vanished</h1>
        <p class="notfound-desc">The beauty product or page you are searching for might have been moved, renamed, or temporarily taken off the shelves.</p>
        <a href="index.html" class="notfound-btn"><i class="fas fa-arrow-left"></i> Return to Homepage</a>
    </div>
</main>

<section class="footer" style="background:#f9f9f9; padding: 2rem 9%; text-align: center;">
    <div class="credit" style="font-size: 1.3rem; color: #777;">
        &copy; 2026 GlowEssence Cosmetics. All rights reserved.
    </div>
</section>

</body>
</html>
